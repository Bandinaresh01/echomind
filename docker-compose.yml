version: '3.8'

services:
  echomind-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echomind-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - LIVEKIT_URL=ws://livekit:7880
    depends_on:
      - livekit
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: echomind-livekit
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped
